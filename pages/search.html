<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Trains • RailConnect Lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/img/logo.svg">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><img src="../assets/img/logo.svg" width="24" height="24" class="me-2">RailConnect Lite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Search Trains</a></li>
          <li class="nav-item"><a class="nav-link" href="pnr.html">PNR Status</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Search Trains</h1>
    <form id="search-form" class="row g-3">
      <div class="col-sm-4">
        <label class="form-label">From (Station Code)</label>
        <input id="from" class="form-control" maxlength="5" required />
        <div class="form-help">Examples: TVC, ERS, MAS, SBC</div>
      </div>
      <div class="col-sm-4">
        <label class="form-label">To (Station Code)</label>
        <input id="to" class="form-control" maxlength="5" required />
      </div>
      <div class="col-sm-3">
        <label class="form-label">Journey Date</label>
        <input id="journey-date" type="date" class="form-control" required />
      </div>
      <div class="col-sm-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
      </div>
    </form>

    <div id="results" class="mt-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
