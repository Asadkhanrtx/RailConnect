<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNR Status • RailConnect Lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/img/logo.svg">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><img src="../assets/img/logo.svg" width="24" height="24" class="me-2">RailConnect Lite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="search.html">Search Trains</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">PNR Status</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">PNR Status (Demo)</h1>
    <form id="pnr-form" class="row g-3">
      <div class="col-sm-6 col-md-4">
        <label class="form-label">Enter 10-digit PNR</label>
        <input id="pnr" class="form-control" maxlength="10" pattern="\d{10}" required placeholder="1234567890" />
      </div>
      <div class="col-sm-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">Check</button>
      </div>
    </form>

    <div id="pnr-result" class="mt-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
